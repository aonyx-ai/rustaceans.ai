<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rustaceans.AI — Build with Rust & AI</title>
<meta name="description" content="A community for people building with Rust and AI. Join the conversation on Discord.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --bg: #080808;
    --surface: #111;
    --rust: #E8491A;
    --rust-glow: #FF5722;
    --ember: #FF8A50;
    --ash: #888;
    --smoke: #444;
    --text: #E0DDD8;
  }

  html { height: 100% }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
    position: relative;
  }

  /* --- grain overlay --- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    z-index: 100;
  }

  /* --- radial forge glow --- */
  .glow {
    position: fixed;
    width: 600px;
    height: 600px;
    top: 50%;
    left: 50%;
    translate: -50% -55%;
    background: radial-gradient(circle, rgba(232,73,26,0.08) 0%, rgba(232,73,26,0.02) 40%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* --- main content --- */
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 2rem;
    animation: fadeIn 1s ease-out both;
  }

  @keyframes fadeIn {
    from { opacity: 0; translate: 0 12px }
    to { opacity: 1; translate: 0 0 }
  }

  /* --- logo --- */
  .logo-wrap {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(232,73,26,0.3);
    box-shadow:
      0 0 40px rgba(232,73,26,0.12),
      0 0 80px rgba(232,73,26,0.05);
    animation: fadeIn 0.8s ease-out both;
    margin-bottom: 2.5rem;
    flex-shrink: 0;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* --- typography --- */
  .title {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 0.75rem;
    animation: fadeIn 0.8s ease-out 0.15s both;
  }

  .title span {
    background: linear-gradient(135deg, var(--rust) 0%, var(--ember) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tagline {
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--ash);
    letter-spacing: 0.01em;
    text-align: center;
    max-width: 360px;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    animation: fadeIn 0.8s ease-out 0.3s both;
  }

  /* --- discord button --- */
  .discord-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.85rem 2rem;
    background: var(--rust);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.01em;
    text-decoration: none;
    border-radius: 8px;
    transition: all 0.25s ease;
    box-shadow: 0 2px 20px rgba(232,73,26,0.25);
    animation: fadeIn 0.8s ease-out 0.45s both;
  }

  .discord-btn:hover {
    background: var(--rust-glow);
    box-shadow: 0 4px 32px rgba(232,73,26,0.4);
    translate: 0 -1px;
  }

  .discord-btn:active {
    translate: 0 0;
    box-shadow: 0 2px 16px rgba(232,73,26,0.3);
  }

  .discord-btn svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  /* --- bottom rule --- */
  .rule {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    translate: -50% 0;
    font-size: 0.7rem;
    color: var(--smoke);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 1;
    animation: fadeIn 1s ease-out 0.8s both;
  }

  /* --- responsive --- */
  @media (max-width: 480px) {
    .logo-wrap { width: 140px; height: 140px; margin-bottom: 2rem }
    .tagline { font-size: 0.85rem }
    .discord-btn { padding: 0.75rem 1.5rem; font-size: 0.9rem }
  }
</style>
</head>
<body>

<div class="glow"></div>

<main class="hero">
  <div class="logo-wrap">
    <img src="logo.svg" alt="Rustaceans.AI logo" width="180" height="180">
  </div>

  <h1 class="title">Rustaceans<span>.AI</span></h1>

  <p class="tagline">A community for people building with Rust&nbsp;and&nbsp;AI</p>

  <a href="https://discord.gg/ZBnpraDapQ" class="discord-btn" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.947 2.418-2.157 2.418z"/></svg>
    Join the Discord

</main>

<div class="rule">Rust &middot; AI &middot; Open Source</div>

</body>
</html>
