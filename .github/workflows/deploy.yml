---
name: Deploy to Cloudflare Workers

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: workers
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required to check out the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wrangler uploads the static assets that `wrangler.jsonc` selects. The
      # account of the Worker comes from a secret rather than from the committed
      # configuration, because this repository is public.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
